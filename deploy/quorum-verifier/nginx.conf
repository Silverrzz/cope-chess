server {
    listen 443 ssl http2;
    server_name quorum.nocturn9x.space;
    ssl_certificate /etc/ingress-ha/tls/current/fullchain.pem;
    ssl_certificate_key /etc/ingress-ha/tls/current/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    access_log /var/log/nginx/cope-quorum.access.log;
    error_log /var/log/nginx/cope-quorum.error.log;
    client_max_body_size 2k;
    location ^~ /api/intake/ {
        access_log off;
        client_max_body_size 16k;
        proxy_pass http://10.0.0.14:8788;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
    # This handler is for the unsigned archive's local admin UI. With signed
    # updates enabled, use a different HTTPS virtual host for port 8789.
    location ~ ^/api/admin/(session|logout|update|update/approve)$ {
        limit_except GET POST { deny all; }
        proxy_pass http://10.0.0.14:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://10.0.0.14:8788;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
