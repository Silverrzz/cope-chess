[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cope-chess"
version = "0.1.0"
description = "COPE tournament runner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-chess>=1.999",
]

[project.optional-dependencies]
database = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]
web = [
    "fastapi>=0.111",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
runner = [
    "websockets>=12,<14",
]
worker = [
    "psutil>=5.9",
    "websockets>=12,<14",
]
dev = []

[project.scripts]
cope = "cope.cli:main"

[tool.setuptools.packages.find]
include = ["cope*"]

[tool.setuptools.package-data]
"cope" = ["VERSION", "BUILD_VERSION"]
"cope.db" = ["schema.sql"]
"cope.web" = [
    "frontend_dist/*",
    "frontend_dist/assets/*",
]
